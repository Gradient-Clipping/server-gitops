apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: identity-bridge
  namespace: flux-system
spec:
  image: ccr.ccs.tencentyun.com/lazycampus/identity-bridge
  interval: 1m0s
  secretRef:
    name: tcr-auth
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: identity-bridge
  namespace: flux-system
spec:
  filterTags:
    extract: $build
    pattern: ^1\.0\.(?P<build>[0-9]+)$
  imageRepositoryRef:
    name: identity-bridge
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: identity-bridge
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@lazycampus.com
        name: Flux Image Automation
      messageTemplate: "chore(images): update identity-bridge"
    push:
      branch: main
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  update:
    path: ./clusters/easy-platform/infrastructure/identity
    strategy: Setters
