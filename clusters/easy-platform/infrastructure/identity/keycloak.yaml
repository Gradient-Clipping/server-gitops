apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity-system
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: ccr.ccs.tencentyun.com/lazycampus/keycloak:26.7.1@sha256:14a382edabb24f92e437911239f8bb344bd7b7612a03949b5b4a45278008a408
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --import-realm
            - --http-port=8080
          env:
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-keycloak
                  key: MYSQL_HOST
            - name: KC_DB_URL_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-keycloak
                  key: MYSQL_PORT
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-keycloak
                  key: MYSQL_DATABASE
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-keycloak
                  key: MYSQL_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-keycloak
                  key: MYSQL_PASSWORD
            - name: KC_HOSTNAME
              value: https://auth.lazycampus.com
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_CACHE
              value: local
            - name: KC_LOG_LEVEL
              value: INFO
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:InitialRAMPercentage=30 -XX:MaxRAMPercentage=65
          envFrom:
            - secretRef:
                name: keycloak-runtime
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /realms/master
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
            items:
              - key: lazycampus-realm.json
                path: lazycampus-realm.json
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity-system
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-profile-reconciler
  namespace: identity-system
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 4
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-profile-reconciler
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: tcr-auth
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: ccr.ccs.tencentyun.com/lazycampus/keycloak:26.7.1@sha256:14a382edabb24f92e437911239f8bb344bd7b7612a03949b5b4a45278008a408
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
              args:
                - |
                  until /opt/keycloak/bin/kcadm.sh config credentials \
                    --config /tmp/kcadm.config \
                    --server http://keycloak:8080 \
                    --realm master \
                    --user "${KC_BOOTSTRAP_ADMIN_USERNAME}" \
                    --password "${KC_BOOTSTRAP_ADMIN_PASSWORD}" >/dev/null 2>&1; do
                    sleep 5
                  done
                  /opt/keycloak/bin/kcadm.sh update realms/lazycampus/users/profile \
                    --config /tmp/kcadm.config \
                    --file /config/user-profile.json
                  /opt/keycloak/bin/kcadm.sh update realms/lazycampus \
                    --config /tmp/kcadm.config \
                    --set 'rememberMe=true' \
                    --set 'ssoSessionIdleTimeout=2592000' \
                    --set 'ssoSessionMaxLifespan=7776000' \
                    --set 'ssoSessionIdleTimeoutRememberMe=2592000' \
                    --set 'ssoSessionMaxLifespanRememberMe=7776000' \
                    --set 'clientSessionIdleTimeout=0' \
                    --set 'clientSessionMaxLifespan=0'
                  client_id="$(/opt/keycloak/bin/kcadm.sh get clients \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --query clientId=smart-shop \
                    --fields id \
                    --format csv \
                    --noquotes | tail -n 1)"
                  test -n "${client_id}"
                  /opt/keycloak/bin/kcadm.sh update "clients/${client_id}" \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --file /config/smart-shop-client.json \
                    --merge

                  headlamp_client_id="$(/opt/keycloak/bin/kcadm.sh get clients \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --query clientId=headlamp \
                    --fields id \
                    --format csv \
                    --noquotes | tail -n 1)"
                  if [[ -z "${headlamp_client_id}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create clients \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --file /config/headlamp-client.json >/dev/null
                    headlamp_client_id="$(/opt/keycloak/bin/kcadm.sh get clients \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --query clientId=headlamp \
                      --fields id \
                      --format csv \
                      --noquotes | tail -n 1)"
                  else
                    /opt/keycloak/bin/kcadm.sh update "clients/${headlamp_client_id}" \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --file /config/headlamp-client.json \
                      --merge
                  fi
                  test -n "${headlamp_client_id}"
                  /opt/keycloak/bin/kcadm.sh update "clients/${headlamp_client_id}" \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --set "secret=${HEADLAMP_OIDC_CLIENT_SECRET}"

                  easy_swu_admin_client_id="$(/opt/keycloak/bin/kcadm.sh get clients \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --query clientId=easy-swu-admin \
                    --fields id \
                    --format csv \
                    --noquotes | tail -n 1)"
                  if [[ -z "${easy_swu_admin_client_id}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create clients \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --file /config/easy-swu-admin-client.json >/dev/null
                    easy_swu_admin_client_id="$(/opt/keycloak/bin/kcadm.sh get clients \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --query clientId=easy-swu-admin \
                      --fields id \
                      --format csv \
                      --noquotes | tail -n 1)"
                  else
                    /opt/keycloak/bin/kcadm.sh update "clients/${easy_swu_admin_client_id}" \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --file /config/easy-swu-admin-client.json \
                      --merge
                  fi
                  test -n "${easy_swu_admin_client_id}"
                  /opt/keycloak/bin/kcadm.sh update "clients/${easy_swu_admin_client_id}" \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --set "secret=${EASY_SWU_ADMIN_OIDC_CLIENT_SECRET}"

                  headlamp_admin_id="$(/opt/keycloak/bin/kcadm.sh get users \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --query username=ystemsrx \
                    --query exact=true \
                    --fields id \
                    --format csv \
                    --noquotes | tail -n 1)"
                  if [[ -z "${headlamp_admin_id}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create users \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --set username=ystemsrx \
                      --set enabled=true \
                      --set emailVerified=true \
                      --set firstName=Platform \
                      --set lastName=Administrator >/dev/null
                  fi
                  /opt/keycloak/bin/kcadm.sh set-password \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --username ystemsrx \
                    --new-password "${YSTEMSRX_PASSWORD}"
                  /opt/keycloak/bin/kcadm.sh add-roles \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --uusername ystemsrx \
                    --rolename platform-admin

                  groups_mapper_id="$(/opt/keycloak/bin/kcadm.sh get \
                    "clients/${headlamp_client_id}/protocol-mappers/models" \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --fields id,name \
                    --format csv \
                    --noquotes | sed -n 's/^\([^,]*\),groups$/\1/p' | sed -n '1p')"
                  if [[ -z "${groups_mapper_id}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create \
                      "clients/${headlamp_client_id}/protocol-mappers/models" \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --file /config/headlamp-groups-mapper.json >/dev/null
                  else
                    /opt/keycloak/bin/kcadm.sh update \
                      "clients/${headlamp_client_id}/protocol-mappers/models/${groups_mapper_id}" \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --file /config/headlamp-groups-mapper.json \
                      --set "id=${groups_mapper_id}"
                  fi

                  viewer_group_id="$(/opt/keycloak/bin/kcadm.sh get groups \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --query search=headlamp-viewers \
                    --query exact=true \
                    --fields id,name \
                    --format csv \
                    --noquotes | sed -n 's/^\([^,]*\),headlamp-viewers$/\1/p' | sed -n '1p')"
                  if [[ -z "${viewer_group_id}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create groups \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --set name=headlamp-viewers >/dev/null
                    viewer_group_id="$(/opt/keycloak/bin/kcadm.sh get groups \
                      --config /tmp/kcadm.config \
                      --target-realm lazycampus \
                      --query search=headlamp-viewers \
                      --query exact=true \
                      --fields id,name \
                      --format csv \
                      --noquotes | sed -n 's/^\([^,]*\),headlamp-viewers$/\1/p' | sed -n '1p')"
                  fi
                  test -n "${viewer_group_id}"
                  /opt/keycloak/bin/kcadm.sh update \
                    "realms/lazycampus/default-groups/${viewer_group_id}" \
                    --config /tmp/kcadm.config \
                    --no-merge >/dev/null

                  headlamp_admin_id="$(/opt/keycloak/bin/kcadm.sh get users \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --query username=ystemsrx \
                    --query exact=true \
                    --fields id \
                    --format csv \
                    --noquotes | tail -n 1)"
                  test -n "${headlamp_admin_id}"
                  /opt/keycloak/bin/kcadm.sh update \
                    "users/${headlamp_admin_id}/groups/${viewer_group_id}" \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --no-merge >/dev/null

                  /opt/keycloak/bin/kcadm.sh update identity-provider/instances/campus \
                    --config /tmp/kcadm.config \
                    --target-realm lazycampus \
                    --set 'config.logoutUrl=https://auth.lazycampus.com/campus/session/end' \
                    --set 'config.loginHint=true'
              envFrom:
                - secretRef:
                    name: keycloak-runtime
              volumeMounts:
                - name: realm-config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          volumes:
            - name: realm-config
              configMap:
                name: keycloak-realm-import
                items:
                  - key: user-profile.json
                    path: user-profile.json
                  - key: smart-shop-client.json
                    path: smart-shop-client.json
                  - key: headlamp-client.json
                    path: headlamp-client.json
                  - key: headlamp-groups-mapper.json
                    path: headlamp-groups-mapper.json
                  - key: easy-swu-admin-client.json
                    path: easy-swu-admin-client.json
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
