---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wecom-kf-oidc-reconciler
  namespace: identity-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wecom-kf-oidc-reconciler
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 8080
          protocol: TCP
