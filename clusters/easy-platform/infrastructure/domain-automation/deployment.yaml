apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-reconciler
  namespace: domain-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: domain-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domain-reconciler
    spec:
      serviceAccountName: domain-reconciler
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ccr.ccs.tencentyun.com/lazycampus/domain-reconciler:1.0.2 # {"$imagepolicy": "flux-system:domain-reconciler"}
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /etc/domain-reconciler/zones.json
            - name: RECONCILE_INTERVAL_SECONDS
              value: "60"
            - name: HTTP_TIMEOUT_SECONDS
              value: "15"
            - name: DRY_RUN
              value: "true"
            - name: TENCENTCLOUD_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: tencentcloud-credentials
                  key: secret-id
            - name: TENCENTCLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tencentcloud-credentials
                  key: secret-key
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-credentials
                  key: api-token
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/domain-reconciler
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: domain-reconciler-config
        - name: tmp
          emptyDir: {}
