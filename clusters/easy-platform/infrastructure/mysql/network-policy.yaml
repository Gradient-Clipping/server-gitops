apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-cluster-only
  namespace: mysql-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3306
          protocol: TCP
