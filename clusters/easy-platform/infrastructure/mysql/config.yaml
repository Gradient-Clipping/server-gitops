apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: mysql-system
data:
  platform.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
    default-time-zone=+00:00
    skip-name-resolve=ON
    mysqlx=OFF
    max-connections=100
    innodb-buffer-pool-size=256M
    innodb-redo-log-capacity=256M
    # Bound auxiliary memory within the shared instance's container limit.
    innodb-log-buffer-size=16M
    key-buffer-size=1M
    table-open-cache=1024
    table-open-cache-instances=4
    table-definition-cache=512
    temptable-max-ram=64M
    temptable-max-mmap=0
    # Keep current/per-session diagnostics; long-history consumers are unused.
    performance-schema=ON
    performance-schema-digests-size=2048
    performance-schema-accounts-size=32
    performance-schema-hosts-size=32
    performance-schema-users-size=16
    performance-schema-max-thread-instances=192
    performance-schema-events-statements-history-long-size=0
    performance-schema-events-transactions-history-long-size=0
    performance-schema-events-stages-history-long-size=0
    performance-schema-events-waits-history-long-size=0
    slow-query-log=ON
    long-query-time=2
    log-output=FILE
  10-create-backup-user.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql --protocol=socket --user=root <<SQL
    CREATE USER IF NOT EXISTS 'platform_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
    ALTER USER 'platform_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
    GRANT SELECT, SHOW VIEW, SHOW_ROUTINE, TRIGGER, EVENT, LOCK TABLES ON *.* TO 'platform_backup'@'%';
    FLUSH PRIVILEGES;
    SQL
