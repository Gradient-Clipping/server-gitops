apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql-system
  labels:
    app.kubernetes.io/name: platform-mysql
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-mysql
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # ConfigMap subPath mounts require a new pod to pick up changed settings.
        platform.lazycampus.com/config-revision: "2026-09-23-binlog-7d-arena-v1"
      labels:
        app.kubernetes.io/name: platform-mysql
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: ccr.ccs.tencentyun.com/lazycampus/mysql:8.4.11@sha256:d0ecae406d2e315d9e025055802b4570e471b5ca3f25bc90d696930755b11742
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              install -d -o 999 -g 999 -m 0750 /var/lib/mysql /var/run/mysqld
              chown -R 999:999 /var/lib/mysql /var/run/mysqld
              chmod 0750 /var/lib/mysql /var/run/mysqld
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/mysqld
      containers:
        - name: mysql
          image: ccr.ccs.tencentyun.com/lazycampus/mysql:8.4.11@sha256:d0ecae406d2e315d9e025055802b4570e471b5ca3f25bc90d696930755b11742
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_BACKUP_PASSWORD
            - name: MYSQL_ROOT_HOST
              value: localhost
            - name: TZ
              value: UTC
            - name: MALLOC_ARENA_MAX
              value: "2"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=socket --user=root --silent
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=socket --user=root --silent
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=socket --user=root --silent
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/platform.cnf
              subPath: platform.cnf
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d/10-create-backup-user.sh
              subPath: 10-create-backup-user.sh
              readOnly: true
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: config
          configMap:
            name: mysql-config
            items:
              - key: platform.cnf
                path: platform.cnf
        - name: init
          configMap:
            name: mysql-config
            defaultMode: 0550
            items:
              - key: 10-create-backup-user.sh
                path: 10-create-backup-user.sh
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
