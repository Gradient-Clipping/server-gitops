apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: mysql-system
  labels:
    app.kubernetes.io/name: platform-mysql-backup
spec:
  schedule: "17 3 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  # Clear the known failed backup history during this repair; restore after verification.
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: platform-mysql-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: tcr-auth
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mysqldump
              image: ccr.ccs.tencentyun.com/lazycampus/mysql:8.4.11@sha256:d0ecae406d2e315d9e025055802b4570e471b5ca3f25bc90d696930755b11742
              imagePullPolicy: IfNotPresent
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-credentials
                      key: MYSQL_BACKUP_PASSWORD
              command:
                - /bin/bash
                - -ec
                - |
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  partial="/backups/all-databases-${timestamp}.sql.partial"
                  target="/backups/all-databases-${timestamp}.sql"
                  trap 'rm -f "${partial}"' EXIT
                  mysqldump \
                    --host=mysql \
                    --user=platform_backup \
                    --all-databases \
                    --single-transaction \
                    --routines \
                    --events \
                    --triggers \
                    --hex-blob \
                    --no-tablespaces \
                    --set-gtid-purged=OFF >"${partial}"
                  mv "${partial}" "${target}"
                  # Dumps live at the volume root; maintenance subdirectories may be root-only.
                  find /backups -maxdepth 1 -type f -name 'all-databases-*.sql' -mmin +7200 -delete
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backups
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
