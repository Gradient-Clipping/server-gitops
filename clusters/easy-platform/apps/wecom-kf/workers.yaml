apiVersion: v1
kind: ConfigMap
metadata:
  name: wecom-kf-config
  namespace: wecom-kf
data:
  WECOM_OPEN_KFID: wkAQ4qXQAA4pT1sFFmnqiEYvFQbaapfw
  WECOM_MESSAGE_PROCESSING_ENABLED: "true"
  EDUCODER_EXECUTION_ENABLED: "true"
  QUESTION_BANK_PATH: /data/question_bank.sqlite
  EDUCODER_CACHE_DIR: /tmp/educoder
  SOWER_BASE_URL: http://172.18.5.87/srpt
  SOWER_RUNTIME_DIR: /work/sower
  TAILSCALE_PROXY_URL: http://tailscale-proxy.tailscale-system.svc.cluster.local:1055
  TAILSCALE_HEALTH_URL: http://tailscale-proxy.tailscale-system.svc.cluster.local:9002/healthz
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wecom-kf-bank
  namespace: wecom-kf
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wecom-kf-sower-runtime
  namespace: wecom-kf
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wecom-kf-workers
  namespace: wecom-kf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wecom-kf-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wecom-kf-workers
        platform.lazycampus.com/campus-network-client: "true"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bank-seed
          image: ccr.ccs.tencentyun.com/lazycampus/educoder-wecom:1.0.32 # {"$imagepolicy": "flux-system:educoder-wecom"}
          command: [python, -m, wecom_kf.seed]
          envFrom:
            - configMapRef:
                name: wecom-kf-config
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: bank, mountPath: /data}
      containers:
        - name: gateway
          image: ccr.ccs.tencentyun.com/lazycampus/educoder-wecom:1.0.32 # {"$imagepolicy": "flux-system:educoder-wecom"}
          command: [python, -m, wecom_kf.worker, gateway]
          envFrom:
            - configMapRef: {name: wecom-kf-config}
            - secretRef: {name: mysql-educoder-wecom}
            - secretRef: {name: educoder-wecom-runtime}
            - secretRef: {name: wecom-kf-api}
          startupProbe:
            exec: {command: [python, -m, wecom_kf.health, gateway]}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec: {command: [python, -m, wecom_kf.health, gateway]}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [python, -m, wecom_kf.health, gateway]}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        - name: actions
          image: ccr.ccs.tencentyun.com/lazycampus/educoder-wecom:1.0.32 # {"$imagepolicy": "flux-system:educoder-wecom"}
          command: [python, -m, wecom_kf.worker, actions]
          envFrom:
            - configMapRef: {name: wecom-kf-config}
            - secretRef: {name: mysql-educoder-wecom}
            - secretRef: {name: educoder-wecom-runtime}
          startupProbe:
            exec: {command: [python, -m, wecom_kf.health, actions]}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec: {command: [python, -m, wecom_kf.health, actions]}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [python, -m, wecom_kf.health, actions]}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        - name: executor
          image: ccr.ccs.tencentyun.com/lazycampus/educoder-wecom:1.0.32 # {"$imagepolicy": "flux-system:educoder-wecom"}
          command: [python, -m, wecom_kf.worker, executor]
          envFrom:
            - configMapRef: {name: wecom-kf-config}
            - secretRef: {name: mysql-educoder-wecom}
            - secretRef: {name: educoder-wecom-runtime}
            - secretRef: {name: wecom-kf-deepseek}
          startupProbe:
            exec: {command: [python, -m, wecom_kf.health, executor]}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec: {command: [python, -m, wecom_kf.health, executor]}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [python, -m, wecom_kf.health, executor]}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: bank, mountPath: /data}
            - {name: sower-runtime, mountPath: /work/sower}
      volumes:
        - name: bank
          persistentVolumeClaim: {claimName: wecom-kf-bank}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: sower-runtime
          persistentVolumeClaim: {claimName: wecom-kf-sower-runtime}
      terminationGracePeriodSeconds: 300
