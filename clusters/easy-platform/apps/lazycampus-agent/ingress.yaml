apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-preview
  namespace: lazycampus-agent
  annotations:
    platform.lazycampus.com/domain-automation: enabled
spec:
  ingressClassName: traefik
  rules:
    - host: preview.lazycampus.com
      http:
        paths:
          - path: /p/
            pathType: Prefix
            backend:
              service:
                name: agent-backend
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-admin
  namespace: lazycampus-agent
  annotations:
    platform.lazycampus.com/domain-automation: enabled
    platform.lazycampus.com/domain-reconcile-request: agent-sso-20260912
spec:
  ingressClassName: traefik
  rules:
    - host: agent.lazycampus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-astrbot
                port: {name: dashboard}
