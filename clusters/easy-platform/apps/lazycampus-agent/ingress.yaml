apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-preview
  namespace: lazycampus-agent
  annotations:
    platform.lazycampus.com/domain-automation: enabled
spec:
  ingressClassName: traefik
  rules:
    - host: preview.lazycampus.com
      http:
        paths:
          - path: /p/
            pathType: Prefix
            backend:
              service:
                name: agent-backend
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-admin
  namespace: lazycampus-agent
  annotations:
    platform.lazycampus.com/domain-automation: enabled
    traefik.ingress.kubernetes.io/router.middlewares: lazycampus-agent-agent-admin-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: agent-admin.lazycampus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-astrbot
                port: {name: dashboard}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agent-admin-auth
  namespace: lazycampus-agent
spec:
  basicAuth:
    secret: agent-admin-http
    removeHeader: true
