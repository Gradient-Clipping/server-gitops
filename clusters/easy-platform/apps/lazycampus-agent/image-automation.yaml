apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: agent-backend
  namespace: flux-system
spec:
  image: ccr.ccs.tencentyun.com/lazycampus/agent-backend
  interval: 1h
  secretRef: {name: tcr-auth}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: agent-backend
  namespace: flux-system
  labels:
    platform.lazycampus.com/image-automation: paused
spec:
  imageRepositoryRef: {name: agent-backend}
  policy:
    semver: {range: ">=1.0.0 <2.0.0"}
---
