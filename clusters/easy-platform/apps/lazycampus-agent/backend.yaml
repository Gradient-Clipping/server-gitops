apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: lazycampus-agent
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-backend}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: tcr-auth}]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ccr.ccs.tencentyun.com/lazycampus/agent-backend:1.0.34759068883 # {"$imagepolicy": "flux-system:agent-backend"}
          envFrom:
            - secretRef: {name: agent-api}
            - secretRef: {name: agent-opencode}
          env:
            - {name: STATE_DIR, value: /state}
            - {name: WORKSPACE_DIR, value: /workspace}
            - {name: PUBLISHED_DIR, value: /published}
            - {name: OPENCODE_URL, value: "http://agent-opencode:4096"}
            - {name: OPENCODE_AGENT, value: campus}
            - {name: SANDBOX_PREVIEW_HOST, value: agent-preview-runtime}
            - {name: PUBLIC_BASE_URL, value: "https://preview.lazycampus.com"}
          ports: [{name: http, containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: workspace, mountPath: /workspace}
            - {name: published, mountPath: /published}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: agent-state}
        - name: workspace
          persistentVolumeClaim: {claimName: agent-workspace}
        - name: published
          persistentVolumeClaim: {claimName: agent-published}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-backend
  namespace: lazycampus-agent
spec:
  selector: {app.kubernetes.io/name: agent-backend}
  ports: [{name: http, port: 8000, targetPort: 8000}]
