apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-rollout, namespace: lazycampus-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-rollout, namespace: lazycampus-agent}
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    resourceNames: [campus-sandbox]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [campus-sandbox]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: agent-rollout, namespace: lazycampus-agent}
subjects: [{kind: ServiceAccount, name: agent-rollout, namespace: lazycampus-agent}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-rollout}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent-rollout, namespace: lazycampus-agent}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: agent-rollout}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.6.0.3/32}
        - ipBlock: {cidr: 10.43.0.1/32}
      ports: [{port: 6443, protocol: TCP}, {port: 443, protocol: TCP}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: agent-rollout, namespace: lazycampus-agent}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: {app.kubernetes.io/name: agent-rollout}
        spec:
          serviceAccountName: agent-rollout
          restartPolicy: Never
          imagePullSecrets: [{name: tcr-auth}]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reconcile
              image: ccr.ccs.tencentyun.com/lazycampus/agent-backend:1.0.35317821571 # {"$imagepolicy": "flux-system:agent-backend"}
              command: [python, /scripts/reconcile_sandbox.py]
              resources:
                requests: {cpu: 10m, memory: 24Mi}
                limits: {cpu: 100m, memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: script
              configMap: {name: agent-rollout-script, defaultMode: 292}
