apiVersion: v1
kind: PersistentVolume
metadata:
  name: agent-workspace
spec:
  capacity: {storage: 8Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: agent-hostpath
  hostPath: {path: /srv/k3s-data/lazycampus-agent/workspace, type: Directory}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [easy-platform-1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-workspace
  namespace: lazycampus-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 8Gi}
  storageClassName: agent-hostpath
  volumeName: agent-workspace
---
