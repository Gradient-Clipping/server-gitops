apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: lazycampus-platform
  namespace: flux-system
spec:
  image: ccr.ccs.tencentyun.com/lazycampus/lazycampus-platform
  interval: 1m0s
  secretRef:
    name: tcr-auth
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: lazycampus-platform
  namespace: flux-system
spec:
  filterTags:
    extract: $build
    pattern: ^1\.0\.(?P<build>[0-9]+)$
  imageRepositoryRef:
    name: lazycampus-platform
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: open-platform
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@lazycampus.com
        name: Flux Image Automation
      messageTemplate: "chore(images): update open-platform"
    push:
      branch: main
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  update:
    path: ./clusters/easy-platform/apps/open-platform
    strategy: Setters
