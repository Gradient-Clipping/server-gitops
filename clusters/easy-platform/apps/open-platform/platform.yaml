apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: open-platform
  labels:
    app.kubernetes.io/name: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: ccr.ccs.tencentyun.com/lazycampus/lazycampus-platform:1.0.11 # {"$imagepolicy": "flux-system:lazycampus-platform"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mysql-platform
            - secretRef:
                name: platform-runtime
            - secretRef:
                name: platform-sender
                optional: true
          env:
            - name: PLATFORM_ORIGIN
              value: https://platform.lazycampus.com
            - name: OIDC_ISSUER
              value: https://auth.lazycampus.com/realms/lazycampus
            - name: OIDC_CLIENT_ID
              value: lazycampus-platform
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CAMPUS_SERVICE_URL
              value: http://api.easy-swu.svc.cluster.local:3000
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: open-platform
spec:
  selector:
    app.kubernetes.io/name: platform
  ports:
    - name: http
      port: 3000
      targetPort: http
