apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-redis
  namespace: open-platform
  labels:
    app.kubernetes.io/name: platform-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-redis
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: ccr.ccs.tencentyun.com/lazycampus/redis:7.4.5-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - yes
            - --appendfsync
            - everysec
            - --save
            - 900 1 300 10 60 10000
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: open-platform
spec:
  selector:
    app.kubernetes.io/name: platform-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
