apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: educoder-wecom-callback-only
  namespace: educoder-wecom
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mysql-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-mysql
      ports:
        - port: 3306
          protocol: TCP
