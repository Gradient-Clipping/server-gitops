apiVersion: apps/v1
kind: Deployment
metadata:
  name: educoder-wecom
  namespace: educoder-wecom
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: educoder-wecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: educoder-wecom
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: callback
          image: ccr.ccs.tencentyun.com/lazycampus/educoder-wecom:1.0.5 # {"$imagepolicy": "flux-system:educoder-wecom"}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: wecom-kf-config
            - secretRef:
                name: mysql-educoder-wecom
            - secretRef:
                name: educoder-wecom-runtime
            - secretRef:
                name: wecom-kf-admin
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: educoder-wecom
  namespace: educoder-wecom
spec:
  selector:
    app.kubernetes.io/name: educoder-wecom
  ports:
    - name: http
      port: 8000
      targetPort: http
