apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbbto-mnp
  namespace: bbbto-mnp
  labels:
    app.kubernetes.io/name: bbbto-mnp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bbbto-mnp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbbto-mnp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ccr.ccs.tencentyun.com/lazycampus/bbbto-mnp:1.0.4 # {"$imagepolicy": "flux-system:bbbto-mnp"}
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_BASE_DIR
              value: /app
            - name: CONFIG_PATH
              value: /config/config.json
            - name: DATABASE_PATH
              value: /data/database.db
            - name: WECHAT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: bbbto-runtime
                  key: WECHAT_APP_ID
            - name: WECHAT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: bbbto-runtime
                  key: WECHAT_APP_SECRET
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbbto-mnp-data
        - name: runtime
          secret:
            secretName: bbbto-runtime
            items:
              - key: config.json
                path: config.json
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
