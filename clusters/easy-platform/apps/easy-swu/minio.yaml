apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-swu-minio
  namespace: easy-swu
  labels:
    app.kubernetes.io/name: easy-swu-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: easy-swu-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easy-swu-minio
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: ccr.ccs.tencentyun.com/lazycampus/minio:RELEASE.2025-09-07T16-13-09Z@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9aa27a994b7b5baad09bbd38866015ff
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --address
            - :9000
            - --console-address
            - :9001
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_BROWSER
              value: "off"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: easy-swu-runtime
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easy-swu-runtime
                  key: MINIO_SECRET_KEY
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: easy-swu-minio
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: easy-swu-minio
  namespace: easy-swu
spec:
  selector:
    app.kubernetes.io/name: easy-swu-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
