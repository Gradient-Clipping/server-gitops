apiVersion: batch/v1
kind: CronJob
metadata:
  name: easy-swu-minio-backup
  namespace: easy-swu
  labels:
    app.kubernetes.io/name: easy-swu-minio-backup
spec:
  schedule: "30 4 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: easy-swu-minio-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: tcr-auth
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ccr.ccs.tencentyun.com/lazycampus/minio:RELEASE.2025-09-07T16-13-09Z@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  backup_root=/backup
                  test "${backup_root}" = /backup
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  destination="${backup_root}/${stamp}"
                  mkdir -p "${destination}/easy-swu-media"
                  mc alias set source http://easy-swu-minio:9000 "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
                  mc mirror --overwrite source/easy-swu-media "${destination}/easy-swu-media"
                  find "${backup_root}" -mindepth 1 -maxdepth 1 -type d -mtime +13 -exec rm -rf -- {} +
              env:
                - name: HOME
                  value: /tmp
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: easy-swu-runtime
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: easy-swu-runtime
                      key: MINIO_SECRET_KEY
              volumeMounts:
                - name: backups
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: easy-swu-minio-backups
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
