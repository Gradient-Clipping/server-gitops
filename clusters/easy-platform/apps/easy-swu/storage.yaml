apiVersion: v1
kind: PersistentVolume
metadata:
  name: easy-swu-redis
  labels:
    app.kubernetes.io/name: easy-swu-redis
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: easy-swu-redis-hostpath
  hostPath:
    path: /srv/k3s-data/easy-swu/redis
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - easy-platform-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: easy-swu-redis
  namespace: easy-swu
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: easy-swu-redis-hostpath
  volumeName: easy-swu-redis
---
