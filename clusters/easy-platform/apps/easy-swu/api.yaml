apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-swu-api
  namespace: easy-swu
  labels:
    app.kubernetes.io/name: easy-swu-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: easy-swu-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easy-swu-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ccr.ccs.tencentyun.com/lazycampus/easy-swu-api:1.0.28 # {"$imagepolicy": "flux-system:easy-swu-api"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mysql-easy-swu
            - secretRef:
                name: easy-swu-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
            - name: API_DOCS_ENABLED
              value: "false"
            - name: ADMIN_OIDC_ISSUER
              value: https://auth.lazycampus.com/realms/lazycampus
            - name: ADMIN_OIDC_CLIENT_ID
              value: easy-swu-admin
            - name: ADMIN_OIDC_REDIRECT_URI
              value: https://easy-admin.lazycampus.com/api/v1/admin/oidc/callback
            - name: ADMIN_OIDC_POST_LOGOUT_REDIRECT_URI
              value: https://easy-admin.lazycampus.com/
            - name: ADMIN_OIDC_USERNAME
              value: ystemsrx
            - name: ADMIN_OIDC_REQUIRED_ROLE
              value: platform-admin
            - name: MYSQL_CONNECTION_LIMIT
              value: "10"
            - name: REDIS_URL
              value: redis://easy-swu-redis:6379/0
            - name: CACHE_TTL_SECONDS
              value: "300"
            - name: MINIO_ENDPOINT
              value: easy-swu-minio
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_BUCKET
              value: easy-swu-media
            - name: SWU_REQUEST_TIMEOUT_MS
              value: "60000"
            - name: SWU_SESSION_IDLE_TIMEOUT_MS
              value: "1800000"
            - name: SWU_SESSION_MAX_ENTRIES
              value: "500"
            - name: TAILSCALE_PROXY_URL
              value: http://127.0.0.1:1055
            - name: TAILSCALE_HEALTH_URL
              value: http://127.0.0.1:9002/healthz
            - name: IDENTITY_BRIDGE_URL
              value: http://identity-bridge.identity-system.svc.cluster.local:3000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/v1/system/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/system/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: tailscale
          image: ccr.ccs.tencentyun.com/lazycampus/tailscale:1.102.3@sha256:1b8596d535841065b0510c797b60bc5f1e43b1804eee7626d315581dcb60b778
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: easy-swu-tailscale
                  key: TS_AUTHKEY
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --accept-routes --shields-up
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: 127.0.0.1:1055
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_ENABLE_METRICS
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 127.0.0.1:9002
            - name: TS_HOSTNAME
              value: easy-swu-campus-gateway
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-run
              mountPath: /var/run/tailscale
            - name: tailscale-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: api-tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: easy-swu-tailscale
        - name: tailscale-run
          emptyDir:
            sizeLimit: 16Mi
        - name: tailscale-tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: easy-swu
spec:
  selector:
    app.kubernetes.io/name: easy-swu-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
