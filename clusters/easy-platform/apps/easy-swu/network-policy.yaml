  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: easy-swu-minio
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: easy-swu-data-retention-access
