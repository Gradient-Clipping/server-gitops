apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: status-page
  labels:
    app.kubernetes.io/name: status-page
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: status-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-page
    spec:
      serviceAccountName: status-page
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status-page
          image: ccr.ccs.tencentyun.com/lazycampus/lazycampus-status:1.0.5 # {"$imagepolicy": "flux-system:lazycampus-status"}
          envFrom:
            - secretRef:
                name: mysql-status
            - secretRef:
                name: status-runtime
            - secretRef:
                name: status-sender
                optional: true
          env:
            - name: STATUS_ORIGIN
              value: https://status.lazycampus.com
            - name: KUBE_ENABLED
              value: "true"
            - name: STATUS_CONFIG
              value: /etc/status/monitors.json
            - name: OIDC_ISSUER
              value: https://auth.lazycampus.com/realms/lazycampus
            - name: OIDC_CLIENT_ID
              value: lazycampus-status
            - name: TRUST_PROXY_CIDRS
              value: 10.42.0.0/16
          ports:
            - name: http
              containerPort: 3100
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: catalog
              mountPath: /etc/status
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog
          configMap:
            name: status-page-catalog
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: status-page
spec:
  selector:
    app.kubernetes.io/name: status-page
  ports:
    - name: http
      port: 3100
      targetPort: http
