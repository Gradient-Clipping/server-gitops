apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: optional-status-reports
  namespace: easy-swu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: easy-swu-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: status-page
          podSelector:
            matchLabels:
              app.kubernetes.io/name: status-page
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: report-to-easy-swu
  namespace: status-page
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: status-page
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: easy-swu
          podSelector:
            matchLabels:
              app.kubernetes.io/name: easy-swu-api
      ports:
        - port: 3000
          protocol: TCP
---
