apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lazycampus-site
  namespace: lazycampus-site
  annotations:
    platform.lazycampus.com/domain-automation: enabled
    platform.lazycampus.com/domain-adopt-existing: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: lazycampus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lazycampus-site
                port:
                  name: http
    - host: www.lazycampus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lazycampus-site
                port:
                  name: http
