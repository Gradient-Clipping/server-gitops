apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-shop-backend-ingress
  namespace: smart-shop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-shop-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 9099
          protocol: TCP
