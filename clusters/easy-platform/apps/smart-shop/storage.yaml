apiVersion: v1
kind: PersistentVolume
metadata:
  name: smart-shop-data
  labels:
    app.kubernetes.io/name: smart-shop
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smart-shop-hostpath
  hostPath:
    path: /srv/k3s-data/smart-shop
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - easy-platform-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-shop-data
  namespace: smart-shop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: smart-shop-hostpath
  volumeName: smart-shop-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: smart-shop-redis
  labels:
    app.kubernetes.io/name: smart-shop-redis
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smart-shop-redis-hostpath
  hostPath:
    path: /srv/k3s-data/smart-shop-redis
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - easy-platform-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-shop-redis
  namespace: smart-shop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: smart-shop-redis-hostpath
  volumeName: smart-shop-redis
