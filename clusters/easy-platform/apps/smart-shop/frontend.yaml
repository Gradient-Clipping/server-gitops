apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-shop-frontend
  namespace: smart-shop
  labels:
    app.kubernetes.io/name: smart-shop-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-shop-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-shop-frontend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ccr.ccs.tencentyun.com/lazycampus/smart-shop-frontend:1.0.19 # {"$imagepolicy": "flux-system:smart-shop-frontend"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smart-shop-frontend
  namespace: smart-shop
spec:
  selector:
    app.kubernetes.io/name: smart-shop-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
