name: Validate desired state

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out desired state
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - name: Render cluster manifests
        run: kubectl kustomize clusters/easy-platform >/tmp/easy-platform.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test domain reconciler
        env:
          PYTHONPATH: controller/domain-reconciler/src
        run: |
          python -m compileall -q controller/domain-reconciler/src
          python -m unittest discover -s controller/domain-reconciler/tests -v

      - name: Validate webhook catalog and provisioning
        run: |
          python scripts/flux_webhooks.py check
          python -m unittest discover -s scripts/tests -v

      - name: Validate host scripts
        run: bash -n scripts/*.sh

  promote:
    name: Promote validated production revision
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: gitops-production-promotion
      cancel-in-progress: false
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Promote without force or stale revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/production_gate.py
